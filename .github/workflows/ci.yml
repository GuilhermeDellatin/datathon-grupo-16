name: Datathon CI/CD

on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'evaluation/**'
      - 'configs/**'
      - 'scripts/**'
      - 'airflow/**'
      - 'docs/**'
      - 'specs/**'
      - 'dvc.yaml'
      - 'dvc.lock'
      - 'pyproject.toml'
      - 'Makefile'
      - 'docker-compose*.yml'
      - '.dockerignore'
      - '.github/workflows/**'
      - 'src/api/Dockerfile'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'evaluation/**'
      - 'configs/**'
      - 'scripts/**'
      - 'airflow/**'
      - 'docs/**'
      - 'specs/**'
      - 'dvc.yaml'
      - 'dvc.lock'
      - 'pyproject.toml'
      - 'Makefile'
      - 'docker-compose*.yml'
      - '.dockerignore'
      - '.github/workflows/**'
      - 'src/api/Dockerfile'

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src/ tests/ evaluation/

      - name: Type check (mypy)
        run: mypy src/ --ignore-missing-imports

      - name: Security scan (bandit)
        run: bandit -r src/ -c pyproject.toml

      - name: Unit tests (pytest)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          pytest tests/ -x \
            --cov=src \
            --cov-report=xml \
            --cov-fail-under=60 \
            --junitxml=test-results.xml \
            -m "not slow and not integration"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results.xml
            coverage.xml

  build-and-publish:
    needs: quality
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # GHCR exige nome da imagem em lowercase. `${{ github.repository }}` vem
      # com o case original do owner (ex.: GuilhermeDellatin/...), então
      # normalizamos via expansão bash `${VAR,,}`.
      - name: Compute lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build com `load: true` carrega a imagem no daemon local pra rodar o
      # smoke test antes de publicar. Cache GHA evita rebuild de layers.
      - name: Build image (load locally)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/api/Dockerfile
          load: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: |
          docker run -d --name test-api -p 8000:8000 \
            -e OPENAI_API_KEY=test \
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          sleep 10
          curl -f http://localhost:8000/ || (docker logs test-api && exit 1)
          docker stop test-api

      # Só publica depois do smoke test passar. Push de cada tag é separado
      # pra falhas isoladas serem fáceis de identificar nos logs.
      - name: Push :sha tag
        run: docker push ${{ steps.image.outputs.name }}:${{ github.sha }}

      - name: Push :staging tag
        run: docker push ${{ steps.image.outputs.name }}:staging
