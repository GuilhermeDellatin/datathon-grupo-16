services:

  airflow-init:
    build:
      context: .
      dockerfile: src/serving/Dockerfile.airflow
    container_name: airflow_init
    environment:
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
    volumes:
      - ./airflow_home:/opt/airflow
    command: >
      bash -c '
      airflow db init &&
      airflow users create \
        --username airflow \
        --password airflow \
        --firstname Airflow \
        --lastname Admin \
        --role Admin \
        --email airflow@example.com
      '

  airflow:
    build:
      context: .
      dockerfile: src/serving/Dockerfile.airflow
    container_name: airflow_local
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      API_BASE_URL: ${API_BASE_URL:-http://api:8000}
      API_TIMEOUT_SECONDS: ${API_TIMEOUT_SECONDS:-120}
      TRAIN_STATUS_POLL_SECONDS: ${TRAIN_STATUS_POLL_SECONDS:-30}
      TRAIN_STATUS_TIMEOUT_SECONDS: ${TRAIN_STATUS_TIMEOUT_SECONDS:-7200}
      METRICS_DIR: /app/metrics
    volumes:
      - ./airflow_home:/opt/airflow
      - ./airflow/dags:/opt/airflow/dags
      - ./metrics:/app/metrics
    command: webserver


  airflow-scheduler:
    build:
      context: .
      dockerfile: src/serving/Dockerfile.airflow
    container_name: airflow_scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      API_BASE_URL: ${API_BASE_URL:-http://api:8000}
      API_TIMEOUT_SECONDS: ${API_TIMEOUT_SECONDS:-120}
      TRAIN_STATUS_POLL_SECONDS: ${TRAIN_STATUS_POLL_SECONDS:-30}
      TRAIN_STATUS_TIMEOUT_SECONDS: ${TRAIN_STATUS_TIMEOUT_SECONDS:-7200}
      METRICS_DIR: /app/metrics
    volumes:
      - ./airflow_home:/opt/airflow
      - ./airflow/dags:/opt/airflow/dags
      - ./metrics:/app/metrics
    command: scheduler
