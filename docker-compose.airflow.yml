version: "3.8"

services:
  airflow:
    build:
      context: .
      dockerfile: src/api/Dockerfile.airflow
    container_name: airflow_local

    user: root

    ports:
      - "8080:8080"

    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
      PROJECT_ROOT: /app
      MLFLOW_TRACKING_URI: file:///opt/airflow/mlruns
      PYTHONPATH: /app
      OPENAI_API_KEY: ${OPENAI_API_KEY}

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./evaluation:/opt/airflow/evaluation
      - ./data:/opt/airflow/data
      - ./configs:/opt/airflow/configs
      - ./models:/opt/airflow/models
      - ./metrics:/opt/airflow/metrics
      - ./mlruns:/opt/airflow/mlruns

    working_dir: /opt/airflow

    extra_hosts:
      - "host.docker.internal:host-gateway"

    command: >
      bash -c "
      airflow db migrate &&
      airflow users create \
        --username airflow \
        --firstname Airflow \
        --lastname Admin \
        --role Admin \
        --email airflow@example.com \
        --password airflow || true &&
      airflow scheduler & airflow webserver
      "
