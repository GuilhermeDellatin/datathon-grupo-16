services:
  api:
    build:
      context: .
      dockerfile: src/api/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Dentro da compose stack os serviços se enxergam pelo nome — não use
      # `localhost`. Estes valores sobrescrevem qualquer override em .env.
      - AIRFLOW_BASE_URL=${AIRFLOW_BASE_URL:-http://airflow:8080}
      - AIRFLOW_USERNAME=${AIRFLOW_USERNAME:-admin}
      - AIRFLOW_PASSWORD=${AIRFLOW_PASSWORD:-admin}
      - AIRFLOW_TRAINING_DAG_ID=${AIRFLOW_TRAINING_DAG_ID:-train_lstm_stock}
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./configs:/app/configs
    depends_on:
      - mlflow
      - airflow
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  airflow:
    build:
      context: .
      dockerfile: src/api/Dockerfile.airflow
    container_name: airflow_local
    # Roda como usuário `airflow` (UID 50000, default da imagem oficial).
    # Isso é necessário porque o binário `airflow` foi instalado em
    # `/home/airflow/.local/bin` durante o build — o `root` não tem esse
    # diretório no PATH e dispara `airflow: command not found`.
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      # Airflow 2.x default só aceita session cookie no REST API. Habilita
      # `basic_auth` para que `POST /api/v1/dags/.../dagRuns` aceite o
      # `Authorization: Basic ...` enviado pelo AirflowClient da API.
      # `session` continua na lista para o UI seguir funcionando.
      AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session"
      AIRFLOW_USERNAME: ${AIRFLOW_USERNAME:-admin}
      AIRFLOW_PASSWORD: ${AIRFLOW_PASSWORD:-admin}
      PROJECT_ROOT: /opt/airflow
      MLFLOW_TRACKING_URI: http://mlflow:5000
      PYTHONPATH: /opt/airflow
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./evaluation:/opt/airflow/evaluation
      - ./data:/opt/airflow/data
      - ./configs:/opt/airflow/configs
      - ./models:/opt/airflow/models
      - ./metrics:/opt/airflow/metrics
      - ./mlruns:/opt/airflow/mlruns
      - ./dvc.yaml:/opt/airflow/dvc.yaml
      - ./dvc.lock:/opt/airflow/dvc.lock
      - ./.dvc:/opt/airflow/.dvc
      - ../dvc-storage:/dvc-storage
    working_dir: /opt/airflow
    # Bloco literal (`|`) para evitar que YAML colapse a continuação dos
    # argumentos do `airflow users create`. `set -e` propaga falhas (exceto
    # o `|| true` deliberado para o caso de usuário já existir).
    # `$$` escapa a interpolação do Compose para que `${VAR}` chegue intacto no
    # bash do container — onde `AIRFLOW_USERNAME`/`AIRFLOW_PASSWORD` vêm do
    # bloco `environment:` acima.
    command:
      - bash
      - -lc
      - |
        set -e
        echo "[airflow] migrating database..."
        airflow db migrate
        echo "[airflow] ensuring admin user '$${AIRFLOW_USERNAME}'..."
        airflow users create \
          --username "$${AIRFLOW_USERNAME}" \
          --firstname Airflow \
          --lastname Admin \
          --role Admin \
          --email airflow@example.com \
          --password "$${AIRFLOW_PASSWORD}" || echo "[airflow] user already exists or create failed"
        echo "[airflow] starting scheduler in background..."
        airflow scheduler &
        echo "[airflow] starting webserver (port 8080)..."
        exec airflow webserver

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.10.0
    ports:
      - "5000:5000"
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db --default-artifact-root /mlflow/artifacts
    volumes:
      - mlflow_data:/mlflow

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=datathon
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  mlflow_data:
  grafana_data:
